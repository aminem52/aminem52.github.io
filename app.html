<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Whisper</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif}
#app{height:100%;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 24px)}
.w{max-width:520px;margin:0 auto}
input{width:100%;background:#000;border:1px solid #27272a;border-radius:12px;color:#fff;padding:12px;font-size:16px;margin:6px 0 12px}
input:focus{outline:0;border-color:#fff}
button{background:#fff;color:#000;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:14px}
button.g{background:#18181b;color:#fff;border:1px solid #27272a}
.card{background:#0a0a0a;border:1px solid #27272a;border-radius:16px;padding:14px;margin:12px 0}
.m{font-family:ui-monospace,Menlo,monospace}.s{color:#a1a1aa;font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:12px;right:12px;background:#fff;color:#000;padding:12px;border-radius:14px;display:none;font-size:13px;font-weight:600;z-index:9}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
const SB_URL = 'https://bbpbeigvfrdshcyydwru.supabase.co';
const SB_KEY = 'sb_publishable_L1joup6cLTwCnb6M4Zxlrg_W7nSJBdi';
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = m => { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3500); };
const emailOf = c => c.trim().toLowerCase() + '@whisper.local';
let me = null, timer = null;

async function loadMe() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return null;
  const { data } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  return data;
}
async function api(body) {
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch(SB_URL + '/functions/v1/admin', { method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + session.access_token }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Request failed');
  return j;
}

function loginView(err) {
  clearInterval(timer);
  app.innerHTML = `<div class="w" style="padding-top:8vh;text-align:center">
    <img src="/icons/icon-192.png" width="84" height="84" style="border-radius:18px">
    <h1 style="margin:14px 0 4px">Welcome to Whisper</h1>
    <div class="s" style="margin-bottom:22px">Private, invite-only messenger. Sign in with the Whisper-Code and password from your Admin.</div>
    ${err ? `<div class="card" style="text-align:left;font-size:13px">${esc(err)}</div>` : ''}
    <form id="f" style="text-align:left"><label class="s">Your Whisper-Code</label>
    <input id="c" class="m" placeholder="WSP-0000-NAME" autocapitalize="characters" autocomplete="username" required>
    <label class="s">Password</label><input id="p" type="password" autocomplete="current-password" required>
    <button style="width:100%;padding:14px">Sign In</button></form></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: emailOf($('#c').value), password: $('#p').value });
    if (error) return loginView('Invalid Whisper-Code or password, or access has been stopped.');
    boot();
  };
}

async function boot() {
  me = await loadMe();
  if (!me) { await sb.auth.signOut(); return loginView(); }
  if (me.status !== 'active') { await sb.auth.signOut(); return loginView('This Whisper-Code has been stopped by the Administrator.'); }
  mainView();
  clearInterval(timer);
  timer = setInterval(async () => {
    const m = await loadMe();
    if (!m || m.status !== 'active') { await sb.auth.signOut(); loginView('Your access was stopped by the Administrator.'); }
  }, 30000);
}

function mainView() {
  const admin = me.role === 'admin';
  app.innerHTML = `<div class="w">
    <div class="row"><div class="row" style="justify-content:flex-start;gap:10px"><img src="/icons/icon-192.png" width="44" height="44" style="border-radius:10px">
      <div><b>${esc(me.alias)}</b><div class="s m">${esc(me.whisper_code)}</div></div></div><button class="g" id="out">Sign out</button></div>
    <div class="card"><b>Messaging</b><div class="s" style="margin-top:6px">End-to-end encrypted chat arrives in the next update. Your secure account is active.</div></div>
    ${admin ? `<div class="card"><b>Create new client</b>
      <label class="s" style="display:block;margin-top:10px">Client full name</label><input id="n" maxlength="60">
      <label class="s">Bio / note (optional)</label><input id="b" maxlength="120">
      <button id="mk" style="width:100%">+ Create client</button><div id="cred"></div></div>
      <div class="card"><b>All clients</b><div id="list" class="s" style="margin-top:8px">Loading...</div></div>` : ''}</div>`;
  $('#out').onclick = async () => { await sb.auth.signOut(); loginView(); };
  if (!admin) return;
  $('#mk').onclick = async () => {
    const alias = $('#n').value.trim();
    if (!alias) return toast('Please enter the client name.');
    $('#mk').disabled = true;
    try {
      const r = await api({ action: 'create', alias, bio: $('#b').value.trim() });
      const text = `Whisper-Code: ${r.code}\nPassword: ${r.password}`;
      $('#cred').innerHTML = `<div class="card m" style="font-size:13px;white-space:pre-wrap">${esc(text)}</div>
        <div class="s">Shown only once. Copy it now and send it to the client.</div>
        <button class="g" id="cp" style="margin-top:8px">Copy login</button>`;
      $('#cp').onclick = () => navigator.clipboard.writeText(text).then(() => toast('Copied.'));
      $('#n').value = ''; $('#b').value = ''; renderClients();
    } catch (x) { toast(x.message); }
    $('#mk').disabled = false;
  };
  $('#list').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    try {
      if (b.dataset.a === 'del') { if (!confirm('Permanently delete this client?')) return; await api({ action: 'delete', id: b.dataset.id }); toast('Client deleted.'); }
      else { await api({ action: 'status', id: b.dataset.id, status: b.dataset.a }); toast('Updated.'); }
      renderClients();
    } catch (x) { toast(x.message); }
  };
  renderClients();
}

async function renderClients() {
  const { data, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
  if (error) return $('#list').textContent = 'Could not load clients.';
  $('#list').innerHTML = data.map(u => `<div class="card row" style="background:#000">
    <div><b style="color:#fff">${esc(u.alias)}</b> <span class="s">${u.status === 'active' ? 'Active' : 'Paused'}</span>
    <div class="s m">${esc(u.whisper_code)}</div></div>
    ${u.role === 'admin' ? '<span class="s">Admin</span>' : `<div class="row">
      <button class="g" data-id="${u.id}" data-a="${u.status === 'active' ? 'paused' : 'active'}">${u.status === 'active' ? 'Pause' : 'Resume'}</button>
      <button class="g" data-id="${u.id}" data-a="del">Delete</button></div>`}</div>`).join('');
}

boot();
</script>
</body>
</html>
