.join('')
.match(/.{1,4}/g)
.slice(0, 8)
.join(' ');

const keyMaterial = await crypto.subtle.digest('SHA-256', enc.encode(secretSeed));

const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, cryptoKey, enc.encode(plainText));

const cipherBase64 = btoa(String.fromCharCode(...new Uint8Array(encrypted)));

cipherText: E2EE::${ivHex}::${cipherBase64},
algorithm: 'Signal Double-Ratchet • AES-256-GCM'

<button
onClick={cycleDisappearingTimer}
className={px-2.5 py-2 rounded-xl border text-xs cursor-pointer ${ activeConversation.disappearingTimer > 0 ? 'bg-white text-black font-bold border-white' : 'bg-zinc-900 border-zinc-800 text-zinc-300' }}
>
⏱ {activeConversation.disappearingTimer > 0 ? ${activeConversation.disappearingTimer}s : 'Off'}
</button>
<button
onClick={() => startCall('voice')}
className="px-3 py-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-white text-xs cursor-pointer"
>
📞 Voice
</button>
<button
onClick={() => startCall('video')}
className="px-3.5 py-2 rounded-xl bg-white hover:bg-zinc-200 text-black font-bold text-xs cursor-pointer"
>
📹 Video
</button>
<button
onClick={handleDeleteActiveChat}
className="px-2.5 py-2 rounded-xl bg-zinc-900 hover:bg-red-950 border border-zinc-800 text-zinc-400 hover:text-red-300 text-xs cursor-pointer"
>
🗑
</button>
</div>
</div>
<div className="flex-1 overflow-y-auto p-4 sm:p-6 space-y-3">
{activeMessages.map((msg) => {
const isMine = msg.senderCode === currentUser.whisperCode;
return (
<div key={msg.id} className={flex flex-col ${isMine ? 'items-end' : 'items-start'}}>
<div
className={max-w-md sm:max-w-lg rounded-2xl px-4 py-2.5 relative group ${ isMine ? 'bg-white text-black rounded-br-xs' : 'bg-[#121212] text-white border border-zinc-800 rounded-bl-xs' }}
>
<p className="text-sm leading-relaxed whitespace-pre-wrap">{msg.text}</p>
<div className="flex items-center justify-between gap-4 mt-1.5 text-[10px] opacity-70">
<div className="flex items-center gap-2">
<button
onClick={() => {
setForwardingMessage(msg);
setShowForwardModal(true);
}}
className="underline cursor-pointer"
>
Forward
</button>
<button
onClick={() => handleDeleteMessage(msg.id)}
className="underline text-red-500 cursor-pointer"
>
Delete
</button>
</div>
<span>{msg.timestamp}</span>
</div>
</div>
</div>
);
})}
<div ref={messagesEndRef} />
</div>
<form onSubmit={handleSendMessage} className="p-3 bg-[#070707] border-t border-zinc-900 flex items-center gap-2">
<input type="file" ref={fileInputRef} onChange={handleFileUpload} className="hidden" />
<button
type="button"
onClick={() => fileInputRef.current?.click()}
className="p-2.5 rounded-xl bg-zinc-900 hover:bg-zinc-800 text-white text-xs cursor-pointer"
>
📎
</button>
<input
type="text"
value={inputText}
onChange={(e) => setInputText(e.target.value)}
placeholder={Encrypted message to ${getConversationDisplayName(activeConversation)}...}
className="flex-1 bg-black border border-zinc-800 focus:border-white rounded-xl px-4 py-2.5 text-sm text-white placeholder-zinc-500 focus:outline-none"
/>
<button
type="submit"
className="px-4 py-2.5 rounded-xl bg-white hover:bg-zinc-200 text-black font-bold text-xs cursor-pointer"
>
Send
</button>
</form>
</>
) : (
<div className="flex-1 flex flex-col items-center justify-center p-8 text-center">
<WhisperLogo className="w-16 h-16 mb-4 opacity-80" />
<h3 className="text-base font-bold text-white">Whisper Encrypted Workspace</h3>
<p className="text-xs text-zinc-500 max-w-xs mt-1">
Select a conversation on the left or add a client by their Whisper-Code to begin chatting.
</p>
</div>
)}
</main>
</div>
)}
</div>
{/* MODAL: ADD CLIENT BY CODE */}
{showAddClientByCodeModal && (
<div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
<div className="w-full max-w-md bg-[#0a0a0a] border border-zinc-800 rounded-3xl p-6">
<div className="flex items-center justify-between mb-4">
<h3 className="text-base font-bold text-white">Add Client by Whisper-Code</h3>
<button onClick={() => setShowAddClientByCodeModal(false)} className="text-zinc-400 hover:text-white">✕</button>
</div>
<form onSubmit={handleAddClientByCode} className="space-y-4">
<input
type="text"
required
value={addCodeInput}
onChange={(e) => setAddCodeInput(e.target.value)}
placeholder="WSP-XXXX-XXXX"
className="w-full bg-black border border-zinc-800 focus:border-white rounded-xl px-4 py-3 text-sm font-mono tracking-wider text-white uppercase"
/>
<button type="submit" className="w-full py-3 rounded-xl bg-white text-black font-bold text-xs uppercase cursor-pointer">
Connect Client
</button>
</form>
</div>
</div>
)}
{/* MODAL: FORWARD MESSAGE */}
{showForwardModal && (
<div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
<div className="w-full max-w-md bg-[#0a0a0a] border border-zinc-800 rounded-3xl p-6">
<div className="flex items-center justify-between mb-4">
<h3 className="text-base font-bold text-white">Forward Message</h3>
<button onClick={() => setShowForwardModal(false)} className="text-zinc-400 hover:text-white">✕</button>
</div>
<div className="space-y-2 max-h-64 overflow-y-auto">
{conversations.map((c) => (
<button
key={c.id}
onClick={() => handleForwardMessageToConv(c.id)}
className="w-full p-3 rounded-2xl bg-black hover:bg-zinc-900 border border-zinc-800 flex items-center justify-between text-left"
>
<span className="text-sm font-bold text-white">{getConversationDisplayName(c)}</span>
<span className="px-3 py-1 rounded-lg bg-white text-black font-bold text-xs">Send</span>
</button>
))}
</div>
</div>
</div>
)}
{/* CALL OVERLAY WITH MINIMIZER & HEADPHONE ROUTING */}
{callState.active && (
<div
className={fixed z-50 bg-black flex flex-col justify-between transition-all duration-300 ${ callState.minimized ? 'bottom-4 right-4 w-80 h-44 rounded-2xl border border-zinc-700 shadow-2xl p-3' : 'inset-0 p-6' }}
>
{callState.minimized ? (
<div className="flex flex-col justify-between h-full">
<div className="flex items-center justify-between">
<span className="text-xs font-bold text-white truncate">{callState.convName}</span>
<div className="flex items-center gap-1.5">
<button
onClick={() => setCallState((prev) => ({ ...prev, minimized: false }))}
className="px-2 py-1 rounded bg-zinc-800 text-white text-xs"
>
Expand
</button>
<button
onClick={endCall}
className="px-2 py-1 rounded bg-red-950 text-red-300 text-xs"
>
End
</button>
</div>
</div>
<div className="text-center font-mono text-xs text-zinc-400">
{formatDuration(callState.duration)} • Audio: {callState.audioOutput}
</div>
</div>
) : (
<>
<div className="flex items-center justify-between border-b border-zinc-900 pb-4">
<div className="flex items-center gap-3">
<WhisperLogo className="w-10 h-10" />
<div>
<div className="text-base font-bold text-white">{callState.convName}</div>
<div className="text-xs font-mono text-zinc-400">{formatDuration(callState.duration)} • E2EE Stream</div>
</div>
</div>
<div className="flex items-center gap-2">
<button
onClick={() => setCallState((prev) => ({ ...prev, minimized: true }))}
className="px-3 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-white text-xs font-bold"
>
Minimize Call
</button>
</div>
</div>
<div className="flex-1 my-6 grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-5xl w-full mx-auto">
{callState.participants.map((p, idx) => (
<div key={idx} className="rounded-3xl bg-[#090909] border border-zinc-800 flex flex-col items-center justify-center relative p-6 overflow-hidden">
{callState.type === 'video' && p.isSelf && !callState.isCameraOff && !callState.localStreamError ? (
<video ref={localVideoRef} autoPlay playsInline muted className="absolute inset-0 w-full h-full object-cover" />
) : (
<>
<div className="w-16 h-16 rounded-full bg-white text-black font-bold text-xl flex items-center justify-center mb-3">
{p.name.charAt(0)}
</div>
<div className="text-sm font-bold text-white">{p.name}</div>
</>
)}
</div>
))}
</div>
<div className="flex flex-wrap items-center justify-center gap-3">
<button
onClick={() => setCallState((prev) => ({ ...prev, isMuted: !prev.isMuted }))}
className={px-4 py-3 rounded-2xl border text-xs font-bold ${ callState.isMuted ? 'bg-white text-black' : 'bg-zinc-900 border-zinc-800 text-white' }}
>
{callState.isMuted ? 'Unmute' : 'Mute'}
</button>
{callState.type === 'video' && (
<button
onClick={handleToggleCameraFacing}
className="px-4 py-3 rounded-2xl bg-zinc-900 border border-zinc-800 text-white text-xs font-bold"
>
Flip Camera ({callState.facingMode})
</button>
)}
<button
onClick={handleToggleAudioOutput}
className="px-4 py-3 rounded-2xl bg-zinc-900 border border-zinc-800 text-white text-xs font-bold capitalize"
>
Audio: {callState.audioOutput}
</button>
<button
onClick={endCall}
className="px-6 py-3 rounded-2xl bg-white text-black font-bold text-xs"
>
End Call
</button>
</div>
</>
)}
</div>
)}
</div>
);
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
