  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // IN-APP LOGO (Original Exact Scale)
    const WhisperLogo = ({ className = "w-10 h-10" }) => (

    );

    const CryptoEngine = {
      async generateFingerprint(seed) {
        try {
          const encoder = new TextEncoder();
          const data = encoder.encode(seed + '_WHISPER_X25519_IDENTITY');
          const hashBuffer = await crypto.subtle.digest('SHA-256', data);
          const hashArray = Array.from(new Uint8Array(hashBuffer));
          return hashArray.map(b => b.toString(16).padStart(2, '0').toUpperCase()).join('').match(/.{1,4}/g).slice(0, 8).join(' ');
        } catch { return '8F92 A10C 44B8 90E1 77D2 31C9 55A0 F19B'; }
      },
      async encryptPayload(plainText, secretSeed = 'WHISPER_SHARED_KEY') {
        try {
          const enc = new TextEncoder();
          const keyMaterial = await crypto.subtle.digest('SHA-256', enc.encode(secretSeed));
          const cryptoKey = await crypto.subtle.importKey('raw', keyMaterial, { name: 'AES-GCM' }, false, ['encrypt']);
          const iv = crypto.getRandomValues(new Uint8Array(12));
          const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, cryptoKey, enc.encode(plainText));
          const ivHex = Array.from(iv).map(b => b.toString(16).padStart(2, '0')).join('');
          const cipherBase64 = btoa(String.fromCharCode(...new Uint8Array(encrypted)));
          return { cipherText: `E2EE::${ivHex}::${cipherBase64}`, algorithm: 'Signal Double-Ratchet • AES-256-GCM' };
        } catch { return { cipherText: `E2EE::9f8a11c0::${btoa(unescape(encodeURIComponent(plainText)))}`, algorithm: 'AES-256-GCM' }; }
      }
    };

    const SUPABASE_URL = 'https://doebvcwecalrvevjozru.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_hcTqF2wiXNneYPgsUWZYIQ_EfELcTrh';

    const SupabaseDirectory = {
      headers() { return { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', Prefer: 'return=representation' }; },
      async fetchClients() {
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/whisper_clients?select=*`, { method: 'GET', headers: this.headers() });
          if (!res.ok) return null;
          const rows = await res.json();
          if (!Array.isArray(rows)) return null;
          return rows.map(r => ({
            id: r.id || 'u_' + r.whisper_code,
            whisperCode: r.whisper_code,
            password: r.password_hash,
            alias: r.alias,
            role: r.role || 'client',
            status: r.status || 'active',
            bio: r.role === 'admin' ? 'Whisper Private Network Owner' : 'Private Whisper Client',
            onlineStatus: r.status === 'paused' ? 'Account Paused' : 'Online',
            publicKey: '8F92 A10C 44B8 90E1 77D2 31C9 55A0 F19B',
            autoReply: '',
            blockedCodes: [],
            addedContacts: ['WSP-1842-ROOT']
          }));
        } catch { return null; }
      },
      async upsertClient(userObj) {
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/whisper_clients?on_conflict=whisper_code`, {
            method: 'POST', headers: { ...this.headers(), Prefer: 'resolution=merge-duplicates,return=representation' },
            body: JSON.stringify({ whisper_code: userObj.whisperCode, password_hash: userObj.password, alias: userObj.alias, role: userObj.role || 'client', status: userObj.status || 'active' })
          });
          return res.ok;
        } catch { return false; }
      },
      async updateClientByCode(whisperCode, patch) {
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/whisper_clients?whisper_code=eq.${encodeURIComponent(whisperCode)}`, { method: 'PATCH', headers: this.headers(), body: JSON.stringify(patch) });
          return res.ok;
        } catch { return false; }
      },
      async deleteClientByCode(whisperCode) {
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/whisper_clients?whisper_code=eq.${encodeURIComponent(whisperCode)}`, { method: 'DELETE', headers: this.headers() });
          return res.ok;
        } catch { return false; }
      }
    };

    const INITIAL_USERS = [{
      id: 'u_admin', whisperCode: 'WSP-1842-ROOT', password: 'admin', alias: 'Administrator', role: 'admin', status: 'active',
      bio: 'Whisper Private Network Owner', onlineStatus: 'Online', publicKey: '8F92 A10C 44B8 90E1 77D2 31C9 55A0 F19B',
      autoReply: '', blockedCodes: [], addedContacts: []
    }];

    const DeviceLocalVault = {
      dbName: 'WhisperPrivateDeviceVault_v1', storeName: 'encrypted_local_state',
      openDB() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(this.dbName, 1);
          request.onupgradeneeded = (e) => { const db = e.target.result; if (!db.objectStoreNames.contains(this.storeName)) db.createObjectStore(this.storeName); };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      },
      async saveKey(key, value) {
        try {
          const db = await this.openDB();
          return new Promise((resolve, reject) => {
            const tx = db.transaction(this.storeName, 'readwrite'); tx.objectStore(this.storeName).put(value, key);
            tx.oncomplete = () => resolve(true); tx.onerror = () => reject(tx.error);
          });
        } catch { return false; }
      },
      async loadKey(key) {
        try {
          const db = await this.openDB();
          return new Promise((resolve, reject) => {
            const tx = db.transaction(this.storeName, 'readonly'); const req = tx.objectStore(this.storeName).get(key);
            req.onsuccess = () => resolve(req.result ?? null); req.onerror = () => reject(req.error);
          });
        } catch { return null; }
      },
      async wipeAllLocalChatData() {
        try {
          const db = await this.openDB();
          return new Promise((resolve, reject) => {
            const tx = db.transaction(this.storeName, 'readwrite'); tx.objectStore(this.storeName).clear();
            tx.oncomplete = () => resolve(true); tx.onerror = () => reject(tx.error);
          });
        } catch { return false; }
      }
    };

    function App() {
      const [users, setUsers] = useState(INITIAL_USERS);
      const [conversations, setConversations] = useState([]);
      const [messages, setMessages] = useState([]);
      const [callHistory, setCallHistory] = useState([]);

      const [currentUser, setCurrentUser] = useState(null);
      const [loginCode, setLoginCode] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [showLoginPassword, setShowLoginPassword] = useState(false);
      const [loginError, setLoginError] = useState('');

      const [activeTab, setActiveTab] = useState('chats');
      const [activeConvId, setActiveConvId] = useState(null);
      const [mobileShowChat, setMobileShowChat] = useState(false);
      const [accountSubView, setAccountSubView] = useState('main');

      const [inputText, setInputText] = useState('');
      const [replyingTo, setReplyingTo] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [showEmojiPicker, setShowEmojiPicker] = useState(false);
      const [inspectCipherId, setInspectCipherId] = useState(null);
      const [isRecordingVoice, setIsRecordingVoice] = useState(false);
      const [recordingSeconds, setRecordingSeconds] = useState(0);
      const [typingIndicatorConvId, setTypingIndicatorConvId] = useState(null);
      const [showContactInfoDrawer, setShowContactInfoDrawer] = useState(false);

      const [showNewChatModal, setShowNewChatModal] = useState(false);
      const [showNewGroupModal, setShowNewGroupModal] = useState(false);
      const [showAddClientByCodeModal, setShowAddClientByCodeModal] = useState(false);
      const [addCodeInput, setAddCodeInput] = useState('');
      const [showSafetyModal, setShowSafetyModal] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      const [forwardingMessage, setForwardingMessage] = useState(null);
      const [showForwardModal, setShowForwardModal] = useState(false);

      const [editAlias, setEditAlias] = useState('');
      const [editBio, setEditBio] = useState('');
      const [currentPassInput, setCurrentPassInput] = useState('');
      const [newPassInput, setNewPassInput] = useState('');
      const [confirmPassInput, setConfirmPassInput] = useState('');

      const [adminSubTab, setAdminSubTab] = useState('clients');
      const [newClientAlias, setNewClientAlias] = useState('');
      const [newClientBio, setNewClientBio] = useState('');
      const [generatedCodePreview, setGeneratedCodePreview] = useState('');
      const [generatedPassPreview, setGeneratedPassPreview] = useState('');

      const [newGroupName, setNewGroupName] = useState('');
      const [selectedGroupMembers, setSelectedGroupMembers] = useState([]);

      const [callState, setCallState] = useState({
        active: false, minimized: false, type: 'voice', convName: '', duration: 0,
        isMuted: false, isCameraOff: false, facingMode: 'user', audioOutput: 'speaker',
        verifyEmoji: '🔒 ⚡ 🦅 🪐', participants: [], localStreamError: false
      });

      const [showAddParticipantModal, setShowAddParticipantModal] = useState(false);
      const localVideoRef = useRef(null);
      const localStreamRef = useRef(null);
      const messagesEndRef = useRef(null);
      const fileInputRef = useRef(null);
      const [vaultHydrated, setVaultHydrated] = useState(false);

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(prev => prev === msg ? null : prev), 3500);
      };

      useEffect(() => {
        let mounted = true;
        (async () => {
          const savedMsgs = await DeviceLocalVault.loadKey('local_messages');
          const savedConvs = await DeviceLocalVault.loadKey('local_conversations');
          const savedUsers = await DeviceLocalVault.loadKey('account_directory');
          const savedCalls = await DeviceLocalVault.loadKey('local_calls');

          if (mounted) {
            if (Array.isArray(savedMsgs) && savedMsgs.length > 0) setMessages(savedMsgs);
            if (Array.isArray(savedConvs) && savedConvs.length > 0) setConversations(savedConvs);
            let baseUsers = INITIAL_USERS;
            if (Array.isArray(savedUsers) && savedUsers.length > 0) {
              const filtered = savedUsers.filter(u => u.whisperCode !== 'WSP-0000-ROOT');
              baseUsers = filtered.some(u => u.whisperCode === 'WSP-1842-ROOT') ? filtered : [INITIAL_USERS[0], ...filtered];
            }
            const remoteUsers = await SupabaseDirectory.fetchClients();
            if (remoteUsers !== null) {
              if (!remoteUsers.some(u => u.whisperCode === 'WSP-1842-ROOT')) await SupabaseDirectory.upsertClient(INITIAL_USERS[0]);
              const map = new Map();
              baseUsers.forEach(u => map.set(u.whisperCode, u));
              remoteUsers.forEach(ru => map.set(ru.whisperCode, { ...map.get(ru.whisperCode), ...ru }));
              baseUsers = Array.from(map.values());
            }
            setUsers(baseUsers);
            if (Array.isArray(savedCalls) && savedCalls.length > 0) setCallHistory(savedCalls);
            setVaultHydrated(true);
          }
        })();
        return () => { mounted = false; };
      }, []);

      useEffect(() => { if (vaultHydrated) DeviceLocalVault.saveKey('local_messages', messages); }, [messages, vaultHydrated]);
      useEffect(() => { if (vaultHydrated) DeviceLocalVault.saveKey('local_conversations', conversations); }, [conversations, vaultHydrated]);
      useEffect(() => { if (vaultHydrated) DeviceLocalVault.saveKey('account_directory', users); }, [users, vaultHydrated]);
      useEffect(() => { if (vaultHydrated) DeviceLocalVault.saveKey('local_calls', callHistory); }, [callHistory, vaultHydrated]);

      useEffect(() => { if (currentUser) { setEditAlias(currentUser.alias); setEditBio(currentUser.bio || ''); } }, [currentUser]);

      useEffect(() => {
        const interval = setInterval(() => { const now = Date.now(); setMessages(prev => prev.filter(m => !m.expiresAt || m.expiresAt > now)); }, 1000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        let timer;
        if (isRecordingVoice) timer = setInterval(() => setRecordingSeconds(s => s + 1), 1000);
        else setRecordingSeconds(0);
        return () => clearInterval(timer);
      }, [isRecordingVoice]);

      useEffect(() => {
        let timer;
        if (callState.active) timer = setInterval(() => setCallState(prev => ({ ...prev, duration: prev.duration + 1 })), 1000);
        return () => clearInterval(timer);
      }, [callState.active]);

      useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, activeConvId, typingIndicatorConvId]);

      useEffect(() => {
        if (currentUser) {
          const updated = users.find(u => u.id === currentUser.id);
          if (!updated || updated.status === 'paused') {
            setCurrentUser(null); setLoginError('Your Whisper-Code access has been paused.');
          } else setCurrentUser(updated);
        }
      }, [users]);

      const generateFreshCredentials = () => {
        const words = ['VORTEX', 'SHADOW', 'SPECTRE', 'CIPHER', 'ONYX', 'ZENITH', 'CROWN', 'VAULT', 'NOVA', 'PULSE'];
        const num = Math.floor(1000 + Math.random() * 9000);
        setGeneratedCodePreview(`WSP-${num}-${words[Math.floor(Math.random() * words.length)]}`);
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
        let pass = ''; for (let i = 0; i < 8; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
        setGeneratedPassPreview(pass);
      };

      useEffect(() => { generateFreshCredentials(); }, []);

      const handleLogin = async (e) => {
        e?.preventDefault();
        setLoginError('');
        const normalizedCode = loginCode.trim().toUpperCase();
        const remoteUsers = await SupabaseDirectory.fetchClients();
        let pool = users;
        if (remoteUsers && remoteUsers.length > 0) {
          const map = new Map();
          users.forEach(u => map.set(u.whisperCode, u));
          remoteUsers.forEach(ru => map.set(ru.whisperCode, { ...map.get(ru.whisperCode), ...ru }));
          pool = Array.from(map.values());
          setUsers(pool);
        }
        const foundUser = pool.find(u => u.whisperCode.toUpperCase() === normalizedCode && u.password === loginPassword);
        if (!foundUser) { setLoginError('Invalid Whisper-Code or password.'); return; }
        if (foundUser.status === 'paused') { setLoginError('Account suspended by Administrator.'); return; }
        setCurrentUser(foundUser); setLoginCode(''); setLoginPassword(''); setActiveTab('chats');
        triggerToast(`Signed in as ${foundUser.alias}`);
      };

      const handleAddClientByCode = async (e) => {
        e.preventDefault();
        const code = addCodeInput.trim().toUpperCase();
        if (!code || !currentUser) return;
        const remoteUsers = await SupabaseDirectory.fetchClients();
        let pool = users;
        if (remoteUsers && remoteUsers.length > 0) {
          const map = new Map();
          users.forEach(u => map.set(u.whisperCode, u));
          remoteUsers.forEach(ru => map.set(ru.whisperCode, { ...map.get(ru.whisperCode), ...ru }));
          pool = Array.from(map.values());
          setUsers(pool);
        }
        const targetUser = pool.find(u => u.whisperCode.toUpperCase() === code);
        if (!targetUser) { triggerToast('Whisper-Code not found.'); return; }
        if (targetUser.whisperCode === currentUser.whisperCode) { triggerToast('Cannot add yourself.'); return; }
        const updatedAdded = Array.from(new Set([...(currentUser.addedContacts || []), targetUser.whisperCode]));
        setUsers(prev => prev.map(u => u.id === currentUser.id ? { ...u, addedContacts: updatedAdded } : u));
        startOrOpenDirectChat(targetUser);
        setAddCodeInput(''); setShowAddClientByCodeModal(false);
        triggerToast(`Added ${targetUser.alias} to network.`);
      };

      const startOrOpenDirectChat = (targetUser) => {
        if (!currentUser || targetUser.whisperCode === currentUser.whisperCode) return;
        const existing = conversations.find(c => c.type === 'direct' && c.participants.includes(currentUser.whisperCode) && c.participants.includes(targetUser.whisperCode));
        if (existing) {
          setActiveConvId(existing.id); setActiveTab('chats'); setMobileShowChat(true); setShowNewChatModal(false); return;
        }
        const newConv = { id: 'conv_direct_' + Date.now(), type: 'direct', name: targetUser.alias, partnerCode: targetUser.whisperCode, participants: [currentUser.whisperCode, targetUser.whisperCode], disappearingTimer: 0, pinned: false, unreadCount: 0 };
        setConversations(prev => [newConv, ...prev]);
        setActiveConvId(newConv.id); setActiveTab('chats'); setMobileShowChat(true); setShowNewChatModal(false);
        triggerToast(`Encrypted chat opened with ${targetUser.alias}`);
      };

      const visibleContacts = useMemo(() => {
        if (!currentUser) return [];

                  {activeTab === 'contacts' && (
                    <div className="flex-1 overflow-y-auto p-3 space-y-2">
                      {visibleContacts.map(u => (
                        <div key={u.id} className="p-3 rounded-2xl bg-black border border-zinc-900 flex justify-between items-center">
                          <div onClick={() => startOrOpenDirectChat(u)} className="flex items-center gap-3 cursor-pointer">
                            <div className="w-11 h-11 rounded-full bg-white text-black font-bold flex items-center justify-center">{u.alias.charAt(0)}</div>
                            <div><div className="font-bold text-sm">{u.alias}</div><div className="text-[10px] font-mono text-zinc-500">{u.whisperCode}</div></div>
                          </div>
                          <button onClick={() => startOrOpenDirectChat(u)} className="p-2 bg-white text-black rounded-xl">💬</button>
                        </div>
                      ))}
                    </div>
                  )}

                  {activeTab === 'calls' && (
                    <div className="flex-1 overflow-y-auto p-3 space-y-2">
                      {callHistory.map(item => (
                        <div key={item.id} className="p-3.5 rounded-2xl bg-black border border-zinc-900 flex justify-between items-center">
                          <div><div className="font-bold text-sm">{item.name}</div><div className="text-[11px] text-zinc-400">{item.time} • {item.type}</div></div>
                          <button onClick={() => startCall(item.type, item.name)} className="px-3 py-1.5 bg-white text-black font-bold text-xs rounded-xl">Call</button>
                        </div>
                      ))}
                    </div>
                  )}

                  {activeTab === 'account' && (
                    <div className="flex-1 overflow-y-auto p-4 space-y-3">
                      <div className="p-4 rounded-2xl bg-black border border-zinc-800 flex items-center gap-3 mb-2">
                        <div className="w-12 h-12 rounded-full bg-white text-black font-bold text-lg flex items-center justify-center">{currentUser.alias.charAt(0)}</div>
                        <div><div className="font-bold text-sm">{currentUser.alias}</div><div className="text-xs font-mono text-zinc-400">{currentUser.whisperCode}</div></div>
                      </div>
                      {accountSubView === 'main' ? (
                        <div className="space-y-2">
                          <button onClick={() => setAccountSubView('profile')} className="w-full p-4 rounded-2xl bg-black border border-zinc-800 text-left font-bold text-sm">⚙️ Edit Account & Password</button>
                          <button onClick={() => setAccountSubView('blocked')} className="w-full p-4 rounded-2xl bg-black border border-zinc-800 text-left font-bold text-sm">🚫 Blocked Clients</button>
                          <button onClick={() => setAccountSubView('vault')} className="w-full p-4 rounded-2xl bg-black border border-zinc-800 text-left font-bold text-sm">💾 Local Device Vault</button>
                        </div>
                      ) : accountSubView === 'profile' ? (
                        <form onSubmit={handleSaveAccountProfile} className="space-y-4">
                          <button type="button" onClick={() => setAccountSubView('main')} className="text-xs px-2 py-1 bg-zinc-900 rounded">⬅️ Back</button>
                          <input type="text" value={editAlias} onChange={e => setEditAlias(e.target.value)} className="w-full bg-[#090909] border border-zinc-800 rounded-xl px-3.5 py-2.5 text-xs" />
                          <input type="password" value={newPassInput} onChange={e => setNewPassInput(e.target.value)} placeholder="New Password" className="w-full bg-[#090909] border border-zinc-800 rounded-xl px-3.5 py-2.5 text-xs" />
                          <button type="submit" className="w-full py-3 bg-white text-black font-bold rounded-xl text-xs">Save</button>
                        </form>
                      ) : accountSubView === 'blocked' ? (
                        <div className="space-y-2">
                          <button onClick={() => setAccountSubView('main')} className="text-xs px-2 py-1 bg-zinc-900 rounded">⬅️ Back</button>
                          {(currentUser.blockedCodes || []).map(code => (
                            <div key={code} className="p-3 bg-black border border-zinc-800 rounded-xl flex justify-between"><span className="font-mono text-xs">{code}</span><button onClick={() => handleToggleBlockPartner(code)} className="px-2 py-1 bg-white text-black text-[10px] rounded">Unblock</button></div>
                          ))}
                        </div>
                      ) : (
                        <div className="space-y-2">
                          <button onClick={() => setAccountSubView('main')} className="text-xs px-2 py-1 bg-zinc-900 rounded">⬅️ Back</button>
                          <button onClick={() => DeviceLocalVault.wipeAllLocalChatData()} className="w-full py-3 bg-zinc-900 text-red-400 rounded-xl text-xs font-bold">🗑️ Wipe Local Chats</button>
                        </div>
                      )}
                    </div>
                  )}
                  <div className="p-3 border-t border-zinc-900 bg-black flex justify-between items-center text-xs">
                    <div className="font-bold truncate">{currentUser.alias}</div>
                    <button onClick={() => setCurrentUser(null)} className="px-2.5 py-1.5 bg-zinc-900 rounded-lg">Switch User</button>
                  </div>
                </aside>

                <main className={`${mobileShowChat ? 'flex' : 'hidden md:flex'} flex-1 flex-col bg-black relative`}>
                  {activeConversation ? (
                    <>
                      <div className="h-16 px-4 border-b border-zinc-900 bg-[#070707] flex justify-between items-center">
                        <div className="flex items-center gap-3">
                          <button onClick={() => setMobileShowChat(false)} className="md:hidden p-2 bg-zinc-900 rounded-xl">⬅️</button>
                          <div className="w-10 h-10 rounded-full bg-white text-black font-bold flex items-center justify-center">{activeConversation.type === 'group' ? '👥' : getConversationDisplayName(activeConversation).charAt(0)}</div>
                          <div><div className="font-bold text-sm">{getConversationDisplayName(activeConversation)} 🔒</div></div>
                        </div>
                        <div className="flex gap-2">
                          <button onClick={cycleDisappearingTimer} className="px-2.5 py-2 border border-zinc-800 rounded-xl text-xs">⏱️ {activeConversation.disappearingTimer || 'Off'}</button>
                          <button onClick={() => startCall('voice')} className="p-2.5 bg-zinc-900 rounded-xl">📞</button>
                          <button onClick={() => startCall('video')} className="px-3.5 py-2 bg-white text-black font-bold rounded-xl text-xs">📹 Video</button>
                        </div>
                      </div>

                      <div className="flex-1 overflow-y-auto p-4 sm:p-6 space-y-3">
                        {activeMessages.map(msg => {
                          const isMine = msg.senderCode === currentUser.whisperCode;
                          return (
                            <div key={msg.id} className={`flex flex-col ${isMine ? 'items-end' : 'items-start'}`}>
                              <div className={`max-w-md rounded-2xl px-4 py-2.5 group ${isMine ? 'bg-white text-black rounded-br-none' : 'bg-[#121212] border border-zinc-800 rounded-bl-none'}`}>
                                <p className="text-sm whitespace-pre-wrap">{msg.text}</p>
                                <div className="flex justify-between items-center gap-4 mt-1 text-[10px] opacity-70">
                                  <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition">
                                    <button onClick={() => { setForwardingMessage(msg); setShowForwardModal(true); }}>➔ Fwd</button>
                                    <button onClick={() => handleDeleteMessage(msg.id)}>🗑️ Del</button>
                                  </div>
                                  <span>{msg.timestamp}</span>
                                </div>
                              </div>
                            </div>
                          );
                        })}
                        {typingIndicatorConvId === activeConversation.id && <div className="text-xs text-zinc-500 italic">typing...</div>}
                        <div ref={messagesEndRef} />
                      </div>

                      <form onSubmit={handleSendMessage} className="p-3 bg-[#070707] border-t border-zinc-900 flex gap-2">
                        <button type="button" onClick={() => setShowEmojiPicker(!showEmojiPicker)} className="p-2.5 bg-zinc-900 rounded-xl">😀</button>
                        <input type="text" value={inputText} onChange={e => setInputText(e.target.value)} placeholder="Message..." className="flex-1 bg-black border border-zinc-800 rounded-xl px-4 text-sm focus:outline-none" />
                        <button type="submit" className="px-4 py-2.5 bg-white text-black font-bold rounded-xl text-xs">Send</button>
                      </form>
                    </>
                  ) : <div className="flex-1 flex items-center justify-center text-zinc-500 text-sm">Select a chat to start messaging</div>}
                </main>
              </div>
            )}
          </div>
          
          {/* MINIMAL MODALS */}
          {showForwardModal && (
            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div className="w-full max-w-md bg-[#0a0a0a] border border-zinc-800 rounded-3xl p-6">
                <div className="flex justify-between mb-4"><h3 className="font-bold">Forward To</h3><button onClick={() => setShowForwardModal(false)}>✕</button></div>
                <div className="space-y-2">{conversations.map(c => <button key={c.id} onClick={() => handleForwardMessageToConv(c.id)} className="w-full p-3 bg-black border border-zinc-800 rounded-xl text-left font-bold">{getConversationDisplayName(c)}</button>)}</div>
              </div>
            </div>
          )}
          
          {/* CALL OVERLAY */}
          {callState.active && (
            <div className={`fixed z-50 bg-black flex flex-col justify-between transition-all ${callState.minimized ? 'bottom-4 right-4 w-72 h-32 rounded-2xl border border-zinc-700 p-3' : 'inset-0 p-6'}`}>
              <div className="flex justify-between border-b border-zinc-900 pb-2 mb-2">
                <div className="font-bold text-white truncate">{callState.convName} • {formatDuration(callState.duration)}</div>
                <div className="flex gap-2">
                  {!callState.minimized && <button onClick={() => setCallState(prev => ({...prev, minimized: true}))} className="px-2 bg-zinc-900 rounded text-xs">Min</button>}
                  {callState.minimized && <button onClick={() => setCallState(prev => ({...prev, minimized: false}))} className="px-2 bg-zinc-900 rounded text-xs">Max</button>}
                  <button onClick={endCall} className="px-2 bg-red-900 text-white rounded text-xs">End</button>
                </div>
              </div>
              {!callState.minimized && (
                <div className="flex-1 flex items-center justify-center">
                  <div className="text-4xl">📞</div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
  </script>
</body>
</html>
