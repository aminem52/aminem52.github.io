<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Whisper</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Whisper" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  </style>
</head>
<body>
  <iframe src="/app.html?v=3" allow="camera; microphone; clipboard-write; fullscreen" title="Whisper"></iframe>
  <script>
    // Fix: the app uses 100vh, which pushes the bottom menu off screen inside the iPhone safe areas.
    document.querySelector('iframe').addEventListener('load', function () {
      try {
        var d = this.contentDocument;
        var s = d.createElement('style');
        s.textContent = '.h-screen{height:100%!important}.w-screen{width:100%!important}.min-h-screen{min-height:100%!important}';
        d.head.appendChild(s);
      } catch (e) {}
    });
    if ('serviceWorker' in navigator) addEventListener('load', function () { navigator.serviceWorker.register('/sw.js'); });
  </script>
</body>
</html>
